<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>LocalVNC isolated input test</title>
<style>
body{margin:24px;background:#0d0e10;color:#dedee4;font:15px system-ui}main{display:flex;gap:24px}.viewport{position:relative;width:640px;height:400px;border:1px solid #444;border-radius:14px;overflow:hidden}#screen{width:100%;height:100%}aside{width:440px}button,input{font:inherit;margin:6px;padding:8px;background:#252830;color:inherit;border:1px solid #555;border-radius:8px}pre{background:#17191e;padding:12px;white-space:pre-wrap;max-height:340px;overflow:auto}.good{color:#9ee0b5}
</style>
<h1>实际 noVNC 输入隔离测试</h1><p>仅连接本机合成 RFB；没有远程凭据或真实机器。状态：<strong id="state">正在连接</strong></p>
<main><section class="viewport"><div id="screen"></div></section><aside>
<label>SSH / 本地输入框 <input id="local-input" placeholder="在这里输入，远端不应收到按键"></label>
<p><button id="clear">清空包日志</button><button id="blur">模拟窗口失焦</button><button id="held-shift">模拟按住 Shift</button><button id="held-mouse">模拟按住鼠标</button></p>
<p><label><input id="readonly" type="checkbox">只读模式</label></p>
<p id="counts">等候数据</p><pre id="packets"></pre></aside></main>
<script type="module">
import RFB from '@novnc/novnc/lib/rfb.js';
import { createVncInputGuard } from '/src/vnc-input.js';
const screen = document.querySelector('#screen'), state = document.querySelector('#state');
const blur = document.querySelector('#blur'), heldShift = document.querySelector('#held-shift'), heldMouse = document.querySelector('#held-mouse');
const guard = createVncInputGuard({ screen, allowControlTargets: [blur, heldShift, heldMouse],
  onChange(value) { state.textContent = value.canControl ? '控制中' : '已暂停'; state.dataset.paused = String(value.paused); } });
const rfb = new RFB(screen, `ws://${location.host}/__fixture/rfb`, { shared: true });
rfb.scaleViewport = true;
rfb.addEventListener('connect', () => { guard.attach(rfb); });
rfb.addEventListener('disconnect', () => { guard.detach(); state.textContent = '已断开'; });
document.querySelector('#clear').onclick = () => fetch('/__fixture/clear', { method: 'POST' });
blur.onclick = () => window.dispatchEvent(new Event('blur'));
heldShift.onclick = () => rfb._canvas.dispatchEvent(new KeyboardEvent('keydown', { key: 'Shift', code: 'ShiftLeft', shiftKey: true, bubbles: true }));
heldMouse.onclick = () => { const rect = rfb._canvas.getBoundingClientRect(); rfb._canvas.dispatchEvent(new MouseEvent('mousedown', { button: 0, buttons: 1, clientX: rect.x + 200, clientY: rect.y + 120, bubbles: true, cancelable: true })); };
document.querySelector('#readonly').onchange = event => guard.setReadOnly(event.target.checked);
setInterval(async () => { const data = await fetch('/__fixture/events').then(response => response.json());
  const keys = data.events.filter(event => event.kind === 'key'), pointers = data.events.filter(event => event.kind === 'pointer');
  document.querySelector('#counts').textContent = `连接 ${data.connections} · 键盘 ${keys.length} · 鼠标 ${pointers.length} · 捕获层 ${document.captureElement ? '存在' : '无'}`;
  document.querySelector('#packets').textContent = JSON.stringify(data.events.slice(-24), null, 2);
}, 200);
window.addEventListener('pagehide', () => { guard.dispose(); rfb.disconnect(); }, { once: true });
</script></html>
