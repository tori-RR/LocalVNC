[package]
name = "localvnc"
version = "0.1.0"
description = "Local console window"
edition = "2021"

[lib]
name = "localvnc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
futures-util = "0.3"
native-tls = "0.2"
openssl = { version = "0.10", features = ["vendored"] }
tokio-openssl = "0.6"
socket2 = { version = "0.6", features = ["all"] }
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
urlencoding = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }

[dev-dependencies]
# Inject exact engine error codes to verify cross-platform retry classification.
openssl-sys = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
